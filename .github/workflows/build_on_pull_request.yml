# prettier-ignore
name: Test Build
on:
  pull_request:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Running NPM Build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26.10'
      - run: npm ci

      - run: npm run build
